# Confere o app a cada push no dev e no main; no main, publica na Cloudflare.
# Veja docs/cloudflare.md.
name: Cloudflare

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

# Um deploy por vez; um push novo no dev cancela a conferência anterior, mas
# um deploy do main em andamento termina antes do próximo começar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Testes, lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    name: Publicar na Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://merce.lucferreira14.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Montar e publicar
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Conferir o site publicado
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://merce.lucferreira14.workers.dev/login)
          echo "/login respondeu $code"
          test "$code" = 200
      # A release sai quando a versão do package.json ainda não tem release.
      # Notas em docs/releases/vX.Y.Z.md (a primeira linha "# ..." é o título);
      # sem o arquivo, as notas são as mensagens dos commits desde a última.
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" > /dev/null 2>&1; then
            echo "A release $v já existe. Suba a versão no package.json para criar outra."
            exit 0
          fi
          file="docs/releases/$v.md"
          if [ -f "$file" ]; then
            title="$(head -n 1 "$file" | sed 's/^# *//')"
            tail -n +2 "$file" > notas.md
          else
            prev="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
            title="$v"
            { echo "## Mudanças"; echo; git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | grep -v '^- Capturas' || true; } > notas.md
          fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$title" --notes-file notas.md --latest
